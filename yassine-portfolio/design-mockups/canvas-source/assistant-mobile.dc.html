</div>
<div style="position: absolute; inset: 0; background: rgba(15,23,42,0.45)"></div>

<!-- bottom sheet -->
<section aria-label="Portfolio assistant" style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; background: #FFFFFF; border-radius: 26px 26px 0 0; box-shadow: 0 -12px 40px rgba(15,23,42,0.25); display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #CBD5E1; margin-top: 10px"></div>

<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Ohm</span>
<button type="button" aria-label="Close assistant" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #F8FAFC; color: #334155; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>

<line x1="115" y1="20" x2="115" y2="44" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"></line>
<circle cx="115" cy="16" r="8" fill="#F59E0B"></circle>

<path d="M100 124 Q115 134 130 124" stroke="#22D3EE" stroke-width="5" fill="none" stroke-linecap="round"></path>
<rect x="62" y="170" width="106" height="62" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"></rect>
<rect x="96" y="188" width="38" height="8" rx="4" fill="#F59E0B"></rect>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Hi, I'm Ohm.</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #475569">I know Yassine's projects, skills and CV. Ask me anything, or start with one of these.</p>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left">
<button type="button" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D9E0E7; background: #F8FAFC; font-family: inherit; font-size: 15px; color: #0F172A; display: flex; align-items: center; justify-content: space-between">What has he built with ESP32?<span style="color: #0E7490">→</span></button>
<button type="button" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D9E0E7; background: #F8FAFC; font-family: inherit; font-size: 15px; color: #0F172A; display: flex; align-items: center; justify-content: space-between">Explain his PFE in 30 seconds<span style="color: #0E7490">→</span></button>
<button type="button" style="min-height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #D9E0E7; background: #F8FAFC; font-family: inherit; font-size: 15px; color: #0F172A; display: flex; align-items: center; justify-content: space-between">Which roles is he looking for?<span style="color: #0E7490">→</span></button>
</div>
</div>

<div style="padding: 12px 16px 28px; border-top: 1px solid #E2E8F0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 8px">
<label for="ask-m" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask a question</label>
<input id="ask-m" type="text" placeholder="Ask a question…" style="flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #CBD5E1; font-family: inherit; font-size: 16px; color: #0F172A">
<button type="button" aria-label="Speak your question" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</button>
</div>
<span style="font-size: 11px; color: #475569; text-align: center">Answers come only from this portfolio.</span>
</div>
</section>
</div>
